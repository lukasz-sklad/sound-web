<body>
  <canvas id="soundcraft_canvas"></canvas>

  <div id="soundcraft_loading">
    <div class="brand-header">
      <div class="brand-badge">🎚️</div>
      <span>SoundCraft</span>
    </div>
    <div class="features-pill">
      <span>PL</span>

      <span>•</span>
      <span>WebGPU / WebGL2</span>
      <span>•</span>
      <span>WebAudio</span>
    </div>
    <div class="spinner"></div>
    <div class="progress-box"><div class="progress-bar" id="loading_bar"></div></div>
    <div class="status-msg" id="loading_msg">Inicjalizacja silnika SoundCraft…</div>
    <div class="status-sub" id="loading_sub">Przygotowywanie WebAssembly i podsystemu audio…</div>
  </div>

  <script>
    // cpal (wasm) builds the output stream at startup, before any user gesture, so the
    // WebAudio AudioContext stays 'suspended': no audio is heard and the transport clock
    // (driven by the audio callback) never advances. Capture the AudioContext cpal creates
    // and resume it on the first user gesture. Runs before the wasm module is instantiated.
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
      }
      ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();

    const CORS_PROXIES = [
      (u) => `https://lmk.one/api/cors?url=${encodeURIComponent(u)}`,
      (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
    ];

    async function fetchWithCorsFallback(fileUrl, fileName) {
      const isCrossOrigin = /^https?:\/\//i.test(fileUrl) && !fileUrl.startsWith(window.location.origin);
      const candidates = isCrossOrigin
        ? [fileUrl, ...CORS_PROXIES.map((fn) => fn(fileUrl))]
        : [fileUrl];

      let lastErr = null;
      for (let i = 0; i < candidates.length; i++) {
        const candidateUrl = candidates[i];
        const viaProxy = i > 0;
        try {
          const resp = await fetch(candidateUrl, {
            credentials: isCrossOrigin ? "omit" : "same-origin"
          });
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
          }
          const bytes = new Uint8Array(await resp.arrayBuffer());
          if (bytes.byteLength === 0) {
            throw new Error("Pusty plik (0 bajtów)");
          }
          return bytes;
        } catch (err) {
          lastErr = err;
          console.warn(`[SoundCraft] Próba pobrania (${viaProxy ? "proxy #" + i : "bezpośrednia"}) nie powiodła się:`, err);
        }
      }
      throw lastErr || new Error("Nie udało się pobrać pliku z podanego adresu URL");
    }

    window.addEventListener("contextmenu", (e) => {
      if (e.target && e.target.id === "soundcraft_canvas") e.preventDefault();
    });

    // Obsługa parametru ?file=... z automatyczną sekwencją pobierania i ładowania
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const fileUrl = params.get("file");
      if (!fileUrl) return;

      const cleanPath = fileUrl.split("?")[0].split("#")[0];
      const fileName = decodeURIComponent(cleanPath.split("/").pop() || "session.scraftz");

      const msg = document.getElementById("loading_msg");
      const sub = document.getElementById("loading_sub");
      if (msg) msg.textContent = `Pobieranie pliku: ${fileName}…`;
      if (sub) sub.textContent = "Nawiązywanie połączenia…";

      try {
        const bytes = await fetchWithCorsFallback(fileUrl, fileName);
        if (msg) msg.textContent = `Wczytywanie sesji: ${fileName}…`;
        if (sub) sub.textContent = `${(bytes.byteLength / (1024 * 1024)).toFixed(2)} MB pobrane`;

        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          const hasFn = typeof window.soundcraft_open_file === "function";
          const canvas = document.getElementById("soundcraft_canvas");
          const loadingGone = !document.getElementById("soundcraft_loading");

          if (hasFn || (loadingGone && canvas)) {
            clearInterval(interval);
            try {
              if (hasFn) {
                window.soundcraft_open_file(fileName, bytes);
              }
              if (canvas && typeof DataTransfer !== "undefined") {
                const dt = new DataTransfer();
                const file = new File([bytes], fileName, { type: "application/octet-stream" });
                dt.items.add(file);
                canvas.dispatchEvent(new DragEvent("drop", { dataTransfer: dt, bubbles: true }));
              }
            } catch (openErr) {
              console.warn("[SoundCraft] Błąd podczas otwierania pliku:", openErr);
            }
          } else if (attempts > 120) {
            clearInterval(interval);
          }
        }, 150);
      } catch (err) {
        console.warn("[SoundCraft] Nie udało się wczytać pliku z ?file=:", err);
      }
    })();
  </script>
</body>
